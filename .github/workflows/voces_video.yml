name: Voces del vídeo largo

on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion: guion_vl (vídeo 1), guion_vc (vídeo 2, Vice City) o guion_sg (vídeo 3, la saga)"
        default: "guion_vl"
      bloques:
        description: "Solo estos bloques (hook,p02,p03...); vacío = todos"
        default: ""

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recuperar las voces ya pedidas
        uses: actions/cache/restore@v4
        with:
          path: cache/voz_vl
          key: voz-vl-${{ github.run_id }}
          restore-keys: voz-vl-

      - name: Pedir las voces que faltan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_VIDEO }}
          GUION: ${{ inputs.guion }}
          BLOQUES_SOLO: ${{ inputs.bloques }}
        run: python3 video_largo/voces.py

      - name: Guardar las voces en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voz_vl
          key: voz-vl-${{ github.run_id }}

      - name: Publicar los MP3 en la rama voces-vl
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMA: ${{ inputs.guion == 'guion_vc' && 'voces-vc' || inputs.guion == 'guion_sg' && 'voces-sg' || 'voces-vl' }}
        run: |
          cd salida_voces
          git init -q
          git checkout -q -b "$RAMA"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Voces del vídeo largo"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f origin "$RAMA"
