name: Voces del vídeo largo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Recuperar las voces ya pedidas
        uses: actions/cache/restore@v4
        with:
          path: cache/voz_vl
          key: voz-vl-${{ github.run_id }}
          restore-keys: voz-vl-

      - name: Pedir las voces que faltan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_VIDEO }}
        run: python3 video_largo/voces.py

      - name: Guardar las voces en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voz_vl
          key: voz-vl-${{ github.run_id }}

      - name: Publicar los MP3 en la rama voces-vl
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida_voces
          git init -q
          git checkout -q -b voces-vl
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Voces del vídeo largo"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f origin voces-vl
