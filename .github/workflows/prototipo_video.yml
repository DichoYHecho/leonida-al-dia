name: Prototipo del vídeo largo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prototipo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install numpy faster-whisper==1.2.1

      - name: Trozos del stock nuevo
        run: git show origin/stock-nuevo:gta/trozos.csv > video_largo/trozos.csv

      - name: Recuperar voces ya pedidas
        uses: actions/cache/restore@v4
        with:
          path: cache/voz
          key: voz-video-largo-${{ github.run_id }}
          restore-keys: voz-video-largo-

      - name: Recuperar el modelo de Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Montar el prototipo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_VIDEO || secrets.GEMINI_API_KEY }}
        run: python video_largo/prototipo.py

      - name: Guardar las voces en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voz
          key: voz-video-largo-${{ github.run_id }}

      - name: Publicar en la rama prototipo-video-largo
        run: |
          cd salida_prototipo
          git init -q
          git checkout -q -b prototipo-video-largo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Prototipo del vídeo largo"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin prototipo-video-largo
