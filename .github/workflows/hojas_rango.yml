name: Hojas por tramos de la mirada extendida

on:
  workflow_dispatch:
    inputs:
      rangos:
        description: "Tramos en segundos (inicio-fin), separados por comas"
        default: "0-20,252-270,840-880,1025-1045"

permissions:
  contents: write

jobs:
  hojas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RANGOS: ${{ inputs.rangos }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Descargar el vídeo oficial (se reanuda si se corta)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            curl -sSfL -A "LeonidaAlDiaBot/1.0 (cuenta de fans de GTA 6) GitHubActions" -C - -o oficial.mp4 "https://videos-rockstargames-com.akamaized.net/v4/rk721912/flv/es-es-1080p.mp4" && break
            echo "Cortado; se reanuda ($i)"; sleep 5
          done
          ls -l oficial.mp4

      - name: Hojas de los tramos
        run: python3 video_largo/hojas_rango.py oficial.mp4

      - name: Publicar en la rama hojas-rango
        if: always()
        run: |
          cd salida_hojas
          git init -q
          git checkout -q -b hojas-rango
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Hojas por tramos"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f origin hojas-rango
