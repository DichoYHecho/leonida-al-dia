name: Preparar propuestas (noticias y datos)

on:
  schedule:
    # Hora UTC: una para verano y otra para invierno (la tarea «hora» elige la buena)
    - cron: "0 6 * * *"     # 08:00 en verano
    - cron: "0 7 * * *"     # 08:00 en invierno
    - cron: "0 17 * * *"    # 19:00 en verano
    - cron: "0 18 * * *"    # 19:00 en invierno
  workflow_dispatch:
    inputs:
      que:
        description: "Qué preparar"
        type: choice
        options: [todo, noticias, datos]
        default: todo
      max:
        description: "Máximo de noticias (vacío = 3 por la mañana y 2 por la tarde)"
        required: false
        default: ""

concurrency:
  group: videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hora:
    # Las horas de arriba están en UTC y hay una para verano y otra para invierno.
    # Esta tarea mira la hora de Madrid de hoy y solo deja seguir la que toca (08:00 y 19:00).
    if: github.event_name == 'schedule' && vars.ACTIVO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.h.outputs.toca }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
          HORAS: "08:00 19:00"
        run: |
          m=$(echo "$CRON" | awk '{print $1}')
          h=$(echo "$CRON" | awk '{print $2}')
          off=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          local=$(printf "%02d:%02d" $(( (10#$h + 10#$off) % 24 )) $((10#$m)))
          if [[ " $HORAS " == *" $local "* ]]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"; echo "Toca: en Madrid son las $local"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"; echo "No toca: en Madrid serían las $local"
          fi

  preparar:
    needs: hora
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.hora.outputs.toca == 'si') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QUE: ${{ inputs.que || 'todo' }}
      MAX: ${{ inputs.max }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Preparar las propuestas y sus vídeos
        run: python gta/preparar.py
      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
