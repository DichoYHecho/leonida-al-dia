name: Montaje del vídeo largo

on:
  workflow_dispatch:
    inputs:
      bloques:
        description: "Solo estos bloques separados por comas (hook,c01,...); vacío = el vídeo entero"
        default: ""
      guion:
        description: "Guion: guion_vl (vídeo 1), guion_vc (vídeo 2, Vice City), guion_sg (vídeo 3, la saga) o guion_jl (vídeo 4, Jason y Lucía)"
        default: "guion_vl"
      solo_voces:
        description: "1 = solo el informe del final de cada voz (sin montar)"
        default: "0"

permissions:
  contents: write

jobs:
  montaje:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BLOQUES_SOLO: ${{ inputs.bloques }}
      GUION: ${{ inputs.guion }}
      RAMA: ${{ inputs.guion == 'guion_vc' && 'montaje-vc' || inputs.guion == 'guion_sg' && (inputs.bloques != '' && 'montaje-sg-previa' || 'montaje-sg') || inputs.guion == 'guion_jl' && (inputs.bloques != '' && 'montaje-jl-previa' || 'montaje-jl') || 'montaje-vl' }}
      SOLO_VOCES: ${{ inputs.solo_voces }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-montserrat fonts-bebas-neue fonts-inter
          pip install numpy pillow faster-whisper==1.2.1

      - name: Trozos del stock nuevo
        run: |
          git show origin/stock-nuevo:gta/trozos.csv > video_largo/trozos.csv
          git show origin/trozos-vc:trozos_auto.csv > video_largo/trozos_auto.csv || true
          git show origin/trozos-sg:trozos_auto.csv > video_largo/trozos_auto_sg.csv || true
          git show origin/trozos-jl:trozos_auto.csv > video_largo/trozos_auto_jl.csv || true

      - name: Recuperar las voces ya pedidas
        uses: actions/cache/restore@v4
        with:
          path: cache/voz_vl
          key: voz-vl-montaje
          restore-keys: voz-vl-

      - name: Recuperar el modelo de Whisper
        uses: actions/cache@v4
        with:
          path: cache/whisper-base
          key: whisper-base-directo-v1

      - name: Montar el vídeo
        shell: bash
        run: |
          # 11 nov: el registro completo no se podía abrir en GitHub; el final queda en el resumen de la ejecución
          mkdir -p salida_montaje
          set -o pipefail
          python3 video_largo/montaje.py 2>&1 | tee salida_montaje/registro.txt
          s=$?
          { echo "### Final del registro del montaje"; echo '```'; tail -n 80 salida_montaje/registro.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $s

      - name: Guardar el vídeo en alta calidad (en Releases, sin el límite de espacio de los artefactos)
        if: always()
        run: |
          ls salida_hq/* >/dev/null 2>&1 || { echo "No hay vídeo en alta calidad"; exit 0; }
          TAG="${RAMA}-alta-calidad"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Vídeo largo en alta calidad ($RAMA)" --notes "Se sustituye en cada montaje."
          gh release upload "$TAG" salida_hq/* --clobber
          echo "Descarga: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la previa en la rama montaje-vl
        if: always()
        run: |
          cd salida_montaje
          git init -q
          git checkout -q -b "$RAMA"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Montaje del vídeo largo"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -f origin "$RAMA"
