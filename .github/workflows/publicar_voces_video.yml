name: Publicar voces de prueba del vídeo largo

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número de la ejecución que generó los audios"
        default: "41304904734"

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voces-video-largo
          path: salida
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir a MP3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p pub
          for f in salida/*.wav; do
            ffmpeg -y -loglevel error -i "$f" -codec:a libmp3lame -q:a 3 "pub/$(basename "${f%.wav}").mp3"
          done
          cp salida/informe.txt pub/ || true
          ls -la pub

      - name: Subir a la rama pruebas-voz-video
        run: |
          cd pub
          git init -q
          git checkout -q -b pruebas-voz-video
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Voces de prueba del vídeo largo"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin pruebas-voz-video
