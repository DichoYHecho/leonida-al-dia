name: Publicar la aprobada

on:
  schedule:
    # Hora UTC: una para verano y otra para invierno (la tarea «hora» elige la buena)
    - cron: "0 10 * * *"         # 12:00 en verano
    - cron: "0 11 * * *"         # 12:00 en invierno
    - cron: "0 15 * * *"         # 17:00 en verano
    - cron: "0 16 * * *"         # 17:00 en invierno
    - cron: "0 19 * * *"         # 21:00 en verano
    - cron: "0 20 * * *"         # 21:00 en invierno
    - cron: "30 18 16-22 11 *"   # 19:30, solo en la semana del lanzamiento (16-22 nov)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: montar el vídeo pero NO publicar"
        type: boolean
        default: true

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hora:
    # Las horas de arriba están en UTC y hay una para verano y otra para invierno.
    # Esta tarea mira la hora de Madrid de hoy y solo deja seguir la que toca (12:00, 17:00 y 21:00, y 19:30 del 16 al 22 nov).
    if: github.event_name == 'schedule' && vars.ACTIVO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.h.outputs.toca }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
          HORAS: "12:00 17:00 21:00 19:30"
        run: |
          m=$(echo "$CRON" | awk '{print $1}')
          h=$(echo "$CRON" | awk '{print $2}')
          off=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          local=$(printf "%02d:%02d" $(( (10#$h + 10#$off) % 24 )) $((10#$m)))
          if [[ " $HORAS " == *" $local "* ]]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"; echo "Toca: en Madrid son las $local"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"; echo "No toca: en Madrid serían las $local"
          fi

  publicar:
    needs: hora
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.hora.outputs.toca == 'si') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Publicar
        run: python gta/publicar.py
      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
