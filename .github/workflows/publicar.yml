name: Publicar la aprobada

on:
  schedule:
    # Hora UTC: una para verano y otra para invierno (la tarea «hora» elige la buena).
    # Se lanza 45 minutos antes de la hora de publicar y deja la publicación programada en Buffer a la hora exacta
    # (GitHub suele ir con retraso; decidido el 22 oct). Hay que aprobar antes de esa hora de preparación.
    - cron: "15 9 * * *"         # 11:15 en verano  → sale a las 12:00
    - cron: "15 10 * * *"        # 11:15 en invierno → sale a las 12:00
    - cron: "15 14 * * *"        # 16:15 en verano  → sale a las 17:00
    - cron: "15 15 * * *"        # 16:15 en invierno → sale a las 17:00
    - cron: "15 18 * * *"        # 20:15 en verano  → sale a las 21:00
    - cron: "15 19 * * *"        # 20:15 en invierno → sale a las 21:00
    - cron: "45 17 16-30 11 *"   # 18:45 → sale a las 19:30, solo del 16 al 30 nov (lanzamiento)
    - cron: "17 22 18 11 *"      # 23:17 del 18 nov: deja programado en Buffer el especial de las 00:00 del 19
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: montar el vídeo pero NO publicar"
        type: boolean
        default: true
      que:
        description: "Qué publicar"
        type: choice
        options: [aprobada, cuenta_atras, lanzamiento]
        default: aprobada
      reintentar:
        description: "Volver a mandar una ya publicada: un trozo de su titular (vacío = no)"
        required: false
        default: ""
      redes:
        description: "Redes a las que volver a mandarla (reel, tiktok, youtube)"
        required: false
        default: "reel"
      para:
        description: "Hora de Madrid (HH:MM) a la que dejarla programada en Buffer; vacío = publicar ya (30 oct)"
        required: false
        default: ""

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hora:
    # Las horas de arriba están en UTC y hay una para verano y otra para invierno.
    # Esta tarea mira la hora de Madrid de hoy y solo deja seguir la que toca: 11:15, 16:15 y 20:15 (salen a las 12:00, 17:00
    # y 21:00) y 18:45 del 16 al 30 nov (sale a las 19:30).
    # El 18 de noviembre a las 23:17 se prepara el especial de lanzamiento (sale a las 00:00 del 19).
    # A las 17:00 se publica la cuenta atrás (decidido el 22 oct) hasta el 18 de noviembre.
    if: github.event_name == 'schedule' && vars.ACTIVO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.h.outputs.toca }}
      hora: ${{ steps.h.outputs.hora }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
          HORAS: "11:15 16:15 20:15 18:45 23:17"
        run: |
          m=$(echo "$CRON" | awk '{print $1}')
          h=$(echo "$CRON" | awk '{print $2}')
          off=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          local=$(printf "%02d:%02d" $(( (10#$h + 10#$off) % 24 )) $((10#$m)))
          echo "hora=$local" >> "$GITHUB_OUTPUT"
          if [[ " $HORAS " == *" $local "* ]]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"; echo "Toca: en Madrid son las $local"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"; echo "No toca: en Madrid serían las $local"
          fi

  publicar:
    needs: hora
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.hora.outputs.toca == 'si') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Publicar (a las 17:00, la cuenta atrás; a las 23:17 del 18 nov, el especial; a las demás horas, la aprobada)
        env:
          HORA: ${{ needs.hora.outputs.hora }}
          QUE: ${{ inputs.que }}
          REINTENTAR: ${{ inputs.reintentar }}
          REDES: ${{ inputs.redes }}
          PARA_MANUAL: ${{ inputs.para }}
        run: |
          case "$HORA" in
            11:15) export PARA=12:00 ;;
            16:15) export PARA=17:00 ;;
            20:15) export PARA=21:00 ;;
            18:45) export PARA=19:30 ;;
          esac
          if [ -n "$PARA_MANUAL" ]; then export PARA="$PARA_MANUAL"; fi
          if [ "$HORA" = "23:17" ] || [ "$QUE" = "lanzamiento" ]; then
            python gta/lanzamiento.py
          elif [ "$HORA" = "16:15" ] || [ "$QUE" = "cuenta_atras" ]; then
            python gta/cuenta_atras.py
          else
            python gta/publicar.py
          fi
      - name: Avisar en Airtable si algo ha fallado
        if: failure() && github.event_name == 'schedule'
        env:
          TAREA: ${{ github.workflow }}
        run: python gta/aviso.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('salida_cuenta/*') != ''
        with:
          name: cuenta-atras-prueba
          path: salida_cuenta/
          retention-days: 7
      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
