name: Comprobar publicaciones

on:
  schedule:
    # Hora UTC: una para verano y otra para invierno (la tarea «hora» elige la buena)
    - cron: "40 10 * * *"        # 12:40 en verano
    - cron: "40 11 * * *"        # 12:40 en invierno
    - cron: "40 15 * * *"        # 17:40 en verano
    - cron: "40 16 * * *"        # 17:40 en invierno
    - cron: "40 19 * * *"        # 21:40 en verano
    - cron: "40 20 * * *"        # 21:40 en invierno
    - cron: "10 19 16-30 11 *"   # 20:10, solo del 16 al 30 nov (lanzamiento)
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuántos días hacia atrás mirar en Buffer"
        default: "4"

permissions:
  contents: read

jobs:
  hora:
    # Las horas de arriba están en UTC y hay una para verano y otra para invierno.
    # Esta tarea mira la hora de Madrid de hoy y solo deja seguir la que toca (40 minutos después de publicar).
    if: github.event_name == 'schedule' && vars.ACTIVO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.h.outputs.toca }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
          HORAS: "12:40 17:40 21:40 20:10"
        run: |
          m=$(echo "$CRON" | awk '{print $1}')
          h=$(echo "$CRON" | awk '{print $2}')
          off=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          local=$(printf "%02d:%02d" $(( (10#$h + 10#$off) % 24 )) $((10#$m)))
          if [[ " $HORAS " == *" $local "* ]]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"; echo "Toca: en Madrid son las $local"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"; echo "No toca: en Madrid serían las $local"
          fi

  comprobar:
    needs: hora
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.hora.outputs.toca == 'si') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_YT_REFRESH_TOKEN: ${{ secrets.GOOGLE_YT_REFRESH_TOKEN }}
      DIAS: ${{ inputs.dias || '4' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -q requests==2.34.2
      - name: Comprobar en Buffer
        run: python gta/comprobar.py
      - name: Avisar en Airtable si algo ha fallado
        if: failure() && github.event_name == 'schedule'
        env:
          TAREA: ${{ github.workflow }}
        run: python gta/aviso.py
