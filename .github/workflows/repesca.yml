name: Repesca de vídeos

on:
  schedule:
    # Hora UTC: una para verano y otra para invierno (la tarea «hora» elige la buena)
    - cron: "30 9 * * *"    # 11:30 en verano: rehace los vídeos que he cambiado en Airtable
    - cron: "30 10 * * *"   # 11:30 en invierno
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántos vídeos rehacer como máximo"
        default: "5"
      limpiar:
        description: "Quitar también los vídeos de publicaciones de hace más de 30 días"
        type: boolean
        default: false
      buscar_imagen:
        description: "Buscar la imagen de la noticia cuyo titular contenga este texto (y rehacer su vídeo)"
        required: false
        default: ""
      paginas_extra:
        description: "Webs o imágenes donde buscar también (separadas por espacios)"
        required: false
        default: ""

concurrency:
  group: videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hora:
    # Las horas de arriba están en UTC y hay una para verano y otra para invierno.
    # Esta tarea mira la hora de Madrid de hoy y solo deja seguir la que toca (11:30).
    if: github.event_name == 'schedule' && vars.ACTIVO == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      toca: ${{ steps.h.outputs.toca }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
          HORAS: "11:30"
        run: |
          m=$(echo "$CRON" | awk '{print $1}')
          h=$(echo "$CRON" | awk '{print $2}')
          off=$(TZ=Europe/Madrid date +%z | cut -c2-3)
          local=$(printf "%02d:%02d" $(( (10#$h + 10#$off) % 24 )) $((10#$m)))
          if [[ " $HORAS " == *" $local "* ]]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"; echo "Toca: en Madrid son las $local"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"; echo "No toca: en Madrid serían las $local"
          fi

  repesca:
    needs: hora
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.hora.outputs.toca == 'si') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      LIMITE: ${{ inputs.limite || '5' }}
      LIMPIAR: ${{ inputs.limpiar }}
      BUSCAR_IMAGEN: ${{ inputs.buscar_imagen }}
      PAGINAS_EXTRA: ${{ inputs.paginas_extra }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Rehacer vídeos
        run: python gta/repesca.py
      - name: Avisar en Airtable si algo ha fallado
        if: failure() && github.event_name == 'schedule'
        env:
          TAREA: ${{ github.workflow }}
        run: python gta/aviso.py
      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/voces
          key: voces-${{ github.run_id }}
