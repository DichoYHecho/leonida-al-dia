name: Prueba (sin publicar ni tocar Airtable)

on:
  workflow_dispatch:
    inputs:
      orden:
        description: "Número del dato del banco para el vídeo de prueba"
        default: "5"
      noticias:
        description: "Probar también la lectura de noticias"
        type: boolean
        default: true
      noticia:
        description: "Enlace de una noticia para probar su imagen (opcional)"
        required: false
        default: ""

permissions:
  contents: write  # 31 oct (rama stock-nuevo): sube las hojas a la rama hojas-stock

jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      ORDEN: ${{ inputs.orden }}
      NOTICIAS: ${{ inputs.noticias }}
      NOTICIA: ${{ inputs.noticia }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Hacer el vídeo de prueba
        run: python gta/prueba.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-de-prueba
          path: salida_prueba/
          retention-days: 7
      - name: Hojas de los vídeos (rama hojas-stock, carpeta Prueba)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 -b hojas-stock "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pub
          rm -rf pub/Prueba && mkdir -p pub/Prueba
          for v in salida_prueba/*.mp4; do
            n=$(basename "$v" .mp4)
            ffmpeg -loglevel error -y -i "$v" -vf "fps=1,scale=180:320,tile=8x3" -frames:v 1 "pub/Prueba/$n.jpg" || true
            cp "$v" pub/Prueba/ || true
          done
          ls -l salida_prueba > pub/Prueba/lista.txt || true
          cd pub && git add -A && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Prueba (run ${{ github.run_number }})" && git push -q
