name: Prueba (sin publicar ni tocar Airtable)

on:
  workflow_dispatch:
    inputs:
      orden:
        description: "Número del dato del banco para el vídeo de prueba"
        default: "5"
      noticias:
        description: "Probar también la lectura de noticias"
        type: boolean
        default: true
      noticia:
        description: "Enlace de una noticia para probar su imagen (opcional)"
        required: false
        default: ""

permissions:
  contents: write  # 9 nov: para dejar el vídeo en la rama muestras-shorts

jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      ORDEN: ${{ inputs.orden }}
      NOTICIAS: ${{ inputs.noticias }}
      NOTICIA: ${{ inputs.noticia }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entorno
      - name: Hacer el vídeo de prueba
        run: python gta/prueba.py
      - name: Dejar el vídeo en la rama muestras-shorts (no depende del almacén de artefactos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls salida_prueba/*.mp4 >/dev/null 2>&1 || exit 0
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b muestras-shorts "$URL" /tmp/m 2>/dev/null || (mkdir -p /tmp/m && cd /tmp/m && git init -q && git checkout -q -b muestras-shorts)
          for f in salida_prueba/*.mp4; do cp "$f" "/tmp/m/dato_${ORDEN}_$(basename "$f")"; ffmpeg -loglevel error -y -i "$f" -vf "fps=2/3,scale=360:-1,tile=6x3" -frames:v 1 "/tmp/m/hoja_${ORDEN}_$(basename "$f" .mp4).jpg" || true; done
          cd /tmp/m && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Muestra del dato ${ORDEN}" && git push -q "$URL" muestras-shorts
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true  # el almacén de artefactos está lleno; el vídeo ya va a muestras-shorts
        with:
          name: video-de-prueba
          path: salida_prueba/
          retention-days: 7
      - name: Hojas de los vídeos (rama hojas-stock, carpeta Prueba)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 -b hojas-stock "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pub
          rm -rf pub/Prueba && mkdir -p pub/Prueba
          for v in salida_prueba/*.mp4; do
            n=$(basename "$v" .mp4)
            ffmpeg -loglevel error -y -i "$v" -vf "fps=1,scale=180:320,tile=8x3" -frames:v 1 "pub/Prueba/$n.jpg" || true
            cp "$v" pub/Prueba/ || true
          done
          ls -l salida_prueba > pub/Prueba/lista.txt || true
          cd pub && git add -A && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Prueba (run ${{ github.run_number }})" && git push -q
