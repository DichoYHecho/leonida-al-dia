name: Comprobar guion del vídeo largo

on:
  push:
    branches: [vice-city, saga]
    paths: ["video_largo/**", ".github/workflows/comprobar_guion_vl.yml"]
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion que se comprueba (guion_vl o guion_vc)"
        default: "guion_vc"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GUION: ${{ inputs.guion || (github.ref_name == 'saga' && 'guion_sg') || 'guion_vc' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install numpy pillow

      - name: Trozos del stock nuevo
        run: |
          git show origin/stock-nuevo:gta/trozos.csv > video_largo/trozos.csv
          git show origin/trozos-vc:trozos_auto.csv > video_largo/trozos_auto.csv || true
          git show origin/trozos-sg:trozos_auto.csv > video_largo/trozos_auto_sg.csv || true

      - name: Comprobar (sin voces ni descargas)
        run: |
          python3 -m py_compile video_largo/*.py
          python3 video_largo/comprobar_guion.py
