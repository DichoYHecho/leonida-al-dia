name: Comprobar guion del vídeo largo

on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion que se comprueba (guion_vl o guion_vc)"
        default: "guion_vc"

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GUION: ${{ inputs.guion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install numpy pillow

      - name: Trozos del stock nuevo
        run: git show origin/stock-nuevo:gta/trozos.csv > video_largo/trozos.csv

      - name: Comprobar (sin voces ni descargas)
        run: |
          python3 -m py_compile video_largo/*.py
          python3 - <<'EOF'
          import importlib, os, pathlib, sys
          sys.path.insert(0, "video_largo")
          os.environ.setdefault("TMP_DIR", "tmp_comprobar")
          import montaje as M
          G = importlib.import_module(os.environ["GUION"])
          tb = M.tabla()
          errores, palabras, t = [], 0, 0.0
          for b in G.BLOQUES:
              for p in b["planos"] + ([b["original"]] if b.get("original") else []):
                  if p not in tb:
                      errores.append(f"{b['id']}: el plano {p} no está en los CSV de trozos")
              palabras += len(b["texto"].split())
              b["dur_voz"] = len(b["texto"].split()) / 2.37
              b["voz_ini"], b["ws"] = t + 0.5, []
              b["fin"] = b["voz_ini"] + b["dur_voz"] + 0.4
              t = b["fin"]
          ass = pathlib.Path("prueba.ass")
          ass.write_text("[V4+ Styles]\nStyle: Dibujo,x\n\n[Events]\n", encoding="utf-8")
          M.anadir_rotulos(ass, G.BLOQUES)
          rot = sum(1 for l in ass.read_text(encoding="utf-8").splitlines() if ",Dato," in l)
          caps = [b.get("capitulo") or b["titulo"].capitalize() for b in G.BLOQUES if b["num"]]
          inf = [f"Guion: {os.environ['GUION']}", f"Bloques: {len(G.BLOQUES)}", f"Palabras: {palabras}",
                 f"Duración aproximada: {t / 60:.1f} min", f"Rótulos de datos: {rot}",
                 "Capítulos: " + " · ".join(caps)] + (errores or ["Sin errores"])
          print("\n".join(inf))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Comprobación del guion\n\n" + "  \n".join(inf) + "\n")
          sys.exit(1 if errores else 0)
          EOF
